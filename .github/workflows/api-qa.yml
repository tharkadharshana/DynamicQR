name: API QA

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      HASH_SALT: ${{ secrets.HASH_SALT }}
      # Dummy PayHere merchant: the QA signs notify payloads with the same secret the server checks.
      PAYHERE_MERCHANT_ID: qa-merchant
      PAYHERE_SECRET: qa-secret
      # Dummy Polar webhook secret + product id: QA signs Standard Webhooks payloads with them.
      POLAR_WEBHOOK_SECRET: qa-polar-secret
      POLAR_PRODUCT_PRO_MONTHLY: prod_qa_pro_monthly
      # QA runs every request from one IP; production keeps the defaults (300 / 60 per 15 min).
      CRON_SECRET: qa-cron-secret
      RATE_LIMIT_MAX: '5000'
      RATE_LIMIT_WRITE_MAX: '1000'
      # The QA signs in as this user to test the template admin routes.
      ADMIN_EMAILS: qa-templates-admin@test.dynamicqr.local
      # AI calls go to a mock the QA starts on port 3101, so CI needs no real OpenAI key and spends nothing.
      OPENAI_API_KEY: qa-openai-key
      OPENAI_BASE_URL: http://localhost:3101/v1
      AI_RATE_MAX: '500'
      NODE_ENV: test
      APP_URL: http://localhost:3000
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Vercel runs the server as Node ESM: relative imports need explicit .js (tsx hides this locally).
      - name: Server imports resolve on Vercel
        run: node scripts/check-server-imports.mjs

      - name: Check db/schema.sql and db/full-setup.sql are current
        run: node scripts/build-db-dump.mjs --check

      # Page routes (like /api-docs) must reach the SPA, API and /internal routes the function.
      - name: Vercel routes
        run: node scripts/check-vercel-routes.mjs

      # Landing entry chunk stays under budget; llms.txt and sitemap.xml keep the shape Lighthouse checks.
      - name: Frontend build checks
        run: npm run build && node scripts/check-bundle.mjs

      - name: Start API server
        run: npm run dev &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start within 30 seconds"
          exit 1

      # Includes the Worker gate engine (section 15b), run in-process with a fake KV.
      - name: Run QA suite
        run: npx tsx tests/qa.ts
        env:
          QA_API_URL: http://localhost:3000

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            *.log
            logs/
          if-no-files-found: ignore
