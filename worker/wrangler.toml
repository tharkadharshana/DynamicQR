name = "dynamic-qr-worker"
main = "worker.js"
compatibility_date = "2024-03-21"

# KV Namespace bindings
# To get your ID:
# 1. Create a KV namespace in the Cloudflare Dashboard (Workers & Pages > KV).
# 2. Copy the ID and paste it below.
[[kv_namespaces]]
binding = "QR_CACHE"
id = "f3238e1d104e4f59a85850f237edb9f8"

# The route `scnr.tharkak.com/*` is attached in the Cloudflare dashboard (tharkak.com > Workers Routes)
# and must point at this Worker, not the retired `qr-redirect` one.
[vars]
MAIN_HOST = "scnr.tharkak.com"

# --- SECRETS (Do NOT commit to git) ---
# Set these with the wrangler CLI (values must match Vercel / the local .env master copy):
#   wrangler secret put API_URL          # https://scnr.tharkak.com
#   wrangler secret put INTERNAL_SECRET
#   wrangler secret put HASH_SALT
